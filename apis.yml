aid: electric-car-scheme
name: Electric Car Scheme
description: >-
  The Electric Car Scheme is a UK B Corp providing electric vehicle salary
  sacrifice as an employee benefit. Employees lease any electric car of their
  choice with the monthly cost deducted from gross salary before Income Tax and
  National Insurance, saving 20-50% versus a personal lease, while employers save
  on Class 1A National Insurance. Packages are all-inclusive (lease, insurance,
  maintenance, servicing and breakdown) with Complete Protection covering
  employees who leave partway through a lease term. The company integrates with
  employer payroll systems via API or SFTP and offers Single Sign-On for
  employees, plus an included Charge Scheme for charging access.
